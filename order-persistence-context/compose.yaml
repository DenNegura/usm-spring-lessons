name: order-jdbc-hibernate
services:
  postgres:
    image: postgres:18
    container_name: orders-postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    ports:
      - "5432:5432"
    volumes:
      - orders_pg_data:/var/lib/postgresql

volumes:
  orders_pg_data:
