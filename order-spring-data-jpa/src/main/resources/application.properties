spring.application.name=order-spring-data-jpa
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/orders}
spring.datasource.username=${DB_USER:student}
spring.datasource.password=${DB_PASSWORD:student}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Пустое / неизвестное значение: только список, без подготовки данных.
app.demo.data-experiment=n-plus-one
