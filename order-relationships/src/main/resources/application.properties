spring.application.name=order-relationships

# Прежняя учебная БД; отдельная schema изолирует пятую лекцию.
spring.datasource.url=jdbc:postgresql://localhost:5432/orders?currentSchema=lesson5
spring.datasource.username=student
spring.datasource.password=student

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Empty means help only, with no data preparation or database writes.
app.demo.relationship-experiment=embeddable
